<section class="container">
    <!-- 客服表單卡片 -->
    <div class="card service-card">
        <h2>📩 聯絡線上客服</h2>
        <p class="service-subtitle">請填寫下方欄位，系統將即時為您建立服務工單。</p>

        <form id="feedbackForm">
            <!-- 💡 加上了 id 方便 JavaScript 抓取數值 -->
            <div class="input-group">
                <input type="text" id="userName" placeholder="您的姓名" required>
            </div>
            <div class="input-group">
                <input type="email" id="userEmail" placeholder="電子郵件 Email" required>
            </div>
            <div class="input-group">
                <textarea id="userMsg" rows="5" placeholder="請輸入您遇到的問題或反饋內容..." required></textarea>
            </div>

            <button type="button" class="btn-submit" onclick="sendMessage()">
                🚀 發送服務工單
            </button>
        </form>
    </div>

    <!-- 🚀 內文下方：新增即時顯示訊息的區塊 -->
    <div id="messageLogSection" class="card log-card" style="display: none;">
        <h3>📋 已提交的服務工單</h3>
        <div id="messageContainer">
            <!-- JavaScript 會把內容塞在這裡 -->
        </div>
    </div>
</section>
